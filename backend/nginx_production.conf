# ==============================================================================
# Shiuli CAD Studio — Production Nginx Configuration
# ==============================================================================
# This configuration resolves HTTP 413 (Request Entity Too Large) and 504 Gateway
# Timeouts when uploading large 3DM, STL, and ZIP CAD files up to 250 MB on live servers.
#
# Place this file in: /etc/nginx/sites-available/shiuli-cad.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/shiuli-cad.conf /etc/nginx/sites-enabled/
# Test with: sudo nginx -t
# Reload with: sudo systemctl reload nginx
# ==============================================================================

upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name shiulicad.com www.shiulicad.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shiulicad.com www.shiulicad.com;

    # SSL Certificates (Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/shiulicad.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shiulicad.com/privkey.pem;

    # --------------------------------------------------------------------------
    # 1. FILE UPLOAD SIZES & TIMEOUTS (CRITICAL FOR 250 MB CAD ATTACHMENTS)
    # --------------------------------------------------------------------------
    # Allows uploads up to 300 MB (250 MB file + multipart boundaries)
    client_max_body_size 300M;
    client_body_buffer_size 512k;
    client_body_timeout 300s;

    # Proxy timeouts to prevent Gunicorn/Daphne premature disconnections during 250MB transfers
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # --------------------------------------------------------------------------
    # 2. STATIC & MEDIA ASSETS
    # --------------------------------------------------------------------------
    location /static/ {
        alias /var/www/shiuli/backend/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /var/www/shiuli/backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --------------------------------------------------------------------------
    # 3. DJANGO REST API & FILE UPLOAD PROXY
    # --------------------------------------------------------------------------
    location /api/ {
        # Enforce 300M limit on API upload routes
        client_max_body_size 300M;
        client_body_buffer_size 512k;

        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for large streaming uploads if needed
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 4. WEBSOCKET NOTIFICATIONS (Daphne / ASGI)
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 5. FRONTEND SPA (Vite / React Build)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/shiuli/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
