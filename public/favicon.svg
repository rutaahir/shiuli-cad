<svg viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Gold Ribbon Metallic Gradient -->
    <linearGradient id="favGoldGrad" x1="30" y1="10" x2="160" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7C2" />
      <stop offset="25%" stop-color="#F5D061" />
      <stop offset="55%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#A67C0D" />
      <stop offset="100%" stop-color="#694B00" />
    </linearGradient>

    <!-- Gold Inner Reflection -->
    <linearGradient id="favGoldHighlight" x1="45" y1="110" x2="135" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#F5E7A3" />
      <stop offset="100%" stop-color="#C29618" />
    </linearGradient>

    <!-- Bottom Vibrant Sapphire Blue Ribbon Gradient -->
    <linearGradient id="favBlueGrad" x1="70" y1="90" x2="175" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#62B5FF" />
      <stop offset="25%" stop-color="#1E82FF" />
      <stop offset="60%" stop-color="#0B4ECB" />
      <stop offset="90%" stop-color="#052E84" />
      <stop offset="100%" stop-color="#021B54" />
    </linearGradient>

    <!-- Sapphire Outer Shadow/Bevel -->
    <linearGradient id="favBlueBevel" x1="100" y1="95" x2="170" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4198FF" />
      <stop offset="60%" stop-color="#0E45A8" />
      <stop offset="100%" stop-color="#041B4B" />
    </linearGradient>

    <filter id="favDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Sapphire Blue Lower Ribbon Loop -->
  <path
    d="M 94 95 C 122 92, 150 108, 160 134 C 172 165, 154 185, 126 195 C 102 203, 85 220, 72 235 C 70 237, 72 232, 75 224 C 88 190, 110 168, 138 152 C 148 146, 150 132, 142 122 C 132 110, 114 104, 94 95 Z"
    fill="url(#favBlueGrad)"
    filter="url(#favDropShadow)"
  />

  <!-- Sapphire 3D Side Fold Overlay -->
  <path
    d="M 126 195 C 145 186, 164 162, 158 136 C 153 118, 134 104, 112 100 L 105 106 C 124 112, 140 124, 142 138 C 146 158, 130 178, 115 186 Z"
    fill="url(#favBlueBevel)"
    opacity="0.9"
  />

  <!-- Top Metallic Gold Swirl Ribbon -->
  <path
    d="M 134 22 C 126 36, 102 60, 74 72 C 48 84, 42 104, 46 128 C 50 150, 68 168, 92 170 C 114 172, 124 162, 120 152 C 114 140, 94 138, 76 132 C 60 126, 56 114, 62 98 C 70 78, 98 56, 134 22 Z"
    fill="url(#favGoldGrad)"
    filter="url(#favDropShadow)"
  />

  <!-- Gold Specular Highlight -->
  <path
    d="M 134 22 C 118 42, 90 66, 68 84 C 58 92, 54 104, 58 116 C 64 106, 76 96, 92 88 C 112 78, 126 54, 134 22 Z"
    fill="url(#favGoldHighlight)"
    opacity="0.8"
  />

  <!-- Interlock Core Shadow -->
  <path
    d="M 88 120 C 96 112, 108 110, 118 114 C 110 122, 98 126, 88 120 Z"
    fill="#03081A"
    opacity="0.65"
  />

  <!-- Top Diamond Facet Sparkle -->
  <circle cx="134" cy="22" r="3.5" fill="#FFFFFF" opacity="0.95" />
</svg>
